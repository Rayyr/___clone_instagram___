

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <link rel="icon" href="../assets/login_register_page_logos/insta_icon.ico">
    <link rel="stylesheet" href="login_style.css">

</head>

 <body>

<div>
<div class="container">
    <!-- LEFT SIDE -->
    <div class="left-side">
            <img src="../assets/login_register_page_logos/entry_logo.png" alt="Instagram logo">
    </div>

    <!-- RIGHT SIDE -->
    <div class="right-side">
        <div class="login-box">
            <img class="instagram-written-text-logo" src="../assets/login_register_page_logos/instagram_text.png" alt="instagram as written text logo">


            <form method="POST">
                <input type="text" name="username" placeholder="Phone number, username, or email" required>
                <input type="password" name="password" placeholder="Password" required>
                <button type="submit">Log in</button><!--in backend-->
            </form>

            <p id="errorMessage" style="color:red;"></p>

            <div class="divider"><span>OR</span></div>

            <a href="../forget_password/forget_password.html" class="forgot">Forgot password?</a>

            <div class="signup">
                Don’t have an account? <a href="../verify_email_when_sign_up/verify_email_when_sign_up.html">Sign up</a>
            </div>
        </div>
</div>

</div> <!-- container end -->


    <div class="footer">
        <div class="meta-info">
            © 2025 Instagram from Meta
        </div>
    </div>


</div>

<script src="login.js"></script>

 </body>
</html>
