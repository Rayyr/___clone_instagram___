<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Profile</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="profile_style.css">

</head>
<body>
<!-- Header/Navigation -->
<header>
    <div class="nav-container">
        <div class="logo">
            <img src="../assets/login_register_page_logos/instagram_text.png" alt="instagram as written text logo">
        </div>
        <input type="text" class="search-bar" placeholder="Search">
        <div class="nav-icons">
            <i class="fas fa-home"></i>
            <i class="far fa-heart"></i>
        </div>
    </div>
</header>

<div class="container">
    <!-- Profile Header -->
    <section class="profile-header">
        <div class="profile-pic">
            <i class="far fa-user"></i>
        </div>
        <div class="profile-info">
            <div class="profile-stats">
                <div><strong>0</strong> posts</div>
                <div><strong>0</strong> followers</div>
                <div><strong>0</strong> following</div>
            </div>
            <h1 class="profile-name">username</h1>
            <p class="profile-bio">Welcome to your profile!</p>
            <div class="profile-actions">
                <button class="btn btn-primary">Edit Profile</button>
            </div>
        </div>
    </section>

    <!-- Tabs -->
    <section class="tabs">
        <div class="tab active">
            <i class="fas fa-table"></i>
            <span>Posts</span>
        </div>
        <div class="tab">
            <i class="fas fa-tv"></i>
            <span>Reels</span>
        </div>
    </section>

    <!-- Empty State -->
    <section class="empty-state">
        <div class="camera-icon">
            <i class="fas fa-camera"></i>
        </div>
        <h2 class="empty-title">Share Photos</h2>
        <p class="empty-description">
            When you share photos, they will appear on your profile.
        </p>
        <button class="share-btn">Share your first photo</button>
    </section>
</div>

<!-- Footer -->
<footer>
    <div class="meta-info">
        English © 2025 Instagram from Meta
    </div>
</footer>


<script src="profile_js.js"></script >
</body>
</html>
