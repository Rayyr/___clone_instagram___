<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up&#8226;Instagram</title>

    <link rel="icon" href="../assets/login_register_page_logos/insta_icon.ico">
    <link rel="stylesheet" href="signup_style.css">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script&display=swap" rel="stylesheet">

</head>
<body>
<div class="container">
    <div class="signup-box">
        <img class="instagram-written-text-logo" src="../assets/login_register_page_logos/instagram_text.png" alt="instagram as written text logo">
        <p class="desc">Sign up to see photos and videos from your friends</p>

        <form>
            <input type="password" placeholder="Password" required>
            <input type="text" placeholder="Username" required>

            <p class="terms">
                People who use our Service may have uploaded your contact information to Instagram.
                <a href="#">Learn more</a>
            </p>
            <p class="terms">
                By registering, you agree to <a href="#">Terms</a> ,
                <a href="#">Privacy Policy</a> and
                <a href="#">Cookies</a>.
            </p>

            <!-- this will be handled with backend php-->
            <button type="submit" class="signup-btn">Sign Up</button>
        </form>
    </div>

    <div class="login-box">
        <p>Do you have an account? <a href="../login/login.html">Log in</a></p>
    </div>
</div>
</body>
</html>
